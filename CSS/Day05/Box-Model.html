<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box-Model</title>
    <style>
        .box1{
            border: 2px solid black;
            box-sizing: content-box;
            width: 250px;
            height: 250px;
            text-align: center;
            padding: 10px;
            margin: 10px;
        }
        .box2{
            border: 2px solid black;
            box-sizing: border-box;
            width: 250px;
            height: 250px;
            text-align: center;
             padding: 10px;
            margin: 10px;
        }
    </style>
  </head>
  <body>
    <div class="box1">
        <h1>My Card</h1>
        <p>HTML Developer</p>
        <p>with box sizing : content-box</p>
    </div>
    <div class="box2">
        <h1>My Card</h1>
        <p>HTML Developer</p>
        <p>with box sizing : border-box</p>
    </div>
  </body>
</html>
