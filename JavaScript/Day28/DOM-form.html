<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Practice</title>
</head>
<body>
    <form id="myForm">
        Name : <input type="text" id="inputName" placeholder="Enter Your Name"><br>
        Age :<input type="number" id = "inputAge"><br>
       <select name="inputCity" id="inputCity">
        <option value="Select your city">Select your city</option>
        <option value="Pune">Pune</option>
        <option value="Delhi">Delhi</option>
        <option value="Jammu">Jammu</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Thane">Thane</option>
       </select><br>
       <input type="submit" value="submit" id = "submit">
    </form>
    <p id="result"></p>

    <script>
        let myForm = document.querySelector("#myForm");
        let inputName = document.querySelector("#inputName");
        let inputAge = document.querySelector("#inputAge");
        let inputCity = document.querySelector("#inputCity");
        let submit = document.querySelector("#submit");
        let result = document.querySelector("#result");
        myForm.addEventListener("submit", function(event){
            event.preventDefault();
            let name = inputName.value;
            let age = inputAge.value;
            let city = inputCity.value;
            result.textContent = "Welcome " + name + ", you are " + age + " years old and you live in " + city + ".";
            
        })
    </script>
    
</body>
</html>
