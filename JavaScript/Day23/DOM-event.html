<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript events</title>
  </head>
  <body>
    <h1 id="heading">My Portfolio</h1>
    <button id="changeBtn">Change Text</button> <br />
    <span> Clicked :</span>
    <span id="counter"> 0 </span><br />
    <button id="countBtn">Count Click</button>
    <button id="darkMode">Dark Theme</button>

    <script>
      let changeBtn = document.querySelector("#changeBtn");
      let heading = document.querySelector("#heading");
      let countBtn = document.querySelector("#countBtn");
      let counter = document.querySelector("#counter");
      let body = document.querySelector("body");
      let darkMode = document.querySelector("#darkMode");
      
      counter;

      changeBtn.addEventListener("click", function () {
      heading.textContent = "Welcome";

      });

      let count = 0;

      countBtn.addEventListener("click", function(){ 
        count++;
        counter.textContent = count;
      });

      darkMode.addEventListener("click", function(){
        body.style.backgroundColor = "black";
        body.style.color = "white";
      })


    </script>
  </body>
</html>
